version: 2

updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      bun:
        patterns:
          - '*'
    # typescript-eslint is the parser behind `edge-apps-scripts lint`, and every
    # published release declares `peer typescript@">=4.8.4 <6.1.0"` — there is no
    # version that accepts TypeScript 7. Bun installs the major anyway and lint
    # then dies with `TypeError: Cannot read properties of undefined (reading
    # 'Cjs')`. Because the bun group matches on a single '*' pattern, that one
    # unusable major also holds back every other bump riding in the same PR.
    # Hold majors until typescript-eslint ships support; minors and patches
    # still flow.
    ignore:
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'

    # typescript-eslint does not support TypeScript 7 yet: its peer range is
    # ">=4.8.4 <6.1.0" as of typescript-eslint 8.71.1, and TypeScript 7 removed
    # the `ts.Extension.Cjs` API that @typescript-eslint/typescript-estree reads,
    # which breaks linting. Remove this once typescript-eslint supports TS 7.
    ignore:
      - dependency-name: 'typescript'
        versions: ['>=6.1.0']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      github-actions:
        patterns:
          - '*'
